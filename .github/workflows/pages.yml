name: Website

# Builds the plugin website from the repository and publishes it to GitHub Pages
# (https://plugins.roguegaming.com.au).

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'scripts/Build-Site.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Generate the site
        shell: pwsh
        run: ./scripts/Build-Site.ps1
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
